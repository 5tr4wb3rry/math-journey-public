<!doctype html>
<!--
  CANONICAL SESSION QUIZ — copy this file to public/unitN/sessionM/quiz.html and edit
  only the two blocks marked CONFIG and PROBLEMS at the bottom. Never edit the engine
  from a session file; if behavior needs to change, change ../../assets/quiz.js so every
  quiz inherits the fix.

  PUBLISHING BOUNDARY: everything under public/ is mirrored to a world-readable repo.
  No solutions, no answer key commentary, no learner's name, nothing from state/ or
  guides/ goes in this file. The accepted-answers array is unavoidable (the engine has
  to score), so keep it terse — reasoning and full worked solutions live in the parent
  guide under guides/, which is never published.

  MIND THE RELATIVE PATHS: the paths below are written for this file's DESTINATION, not
  for _template/, so opening this file where it sits will not load the stylesheet or the
  engine. A quiz at public/unitN/sessionM/quiz.html is two levels deep and uses
  ../../assets/. A unit checkpoint at public/unitN/checkpoint.html is one level deep and
  uses ../assets/ — fix both <link> and <script> when you copy.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit N · Session M — Math Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/quiz.css">
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">Unit N · Session M</p>
      <h1>Session title goes here</h1>
      <p class="lede">
        One or two sentences of framing. No time limit. Get it wrong as many times as you
        like before you finish — nothing is checked until the last button.
      </p>
    </header>

    <!-- The engine renders everything into this element. Leave it empty. -->
    <main id="quiz"></main>
  </div>

  <script src="../../assets/quiz.js"></script>
  <script>
    /* ---------------------------------------------------------------- CONFIG
       unit / session  — used in the heading and in the report filename,
                         report_unit{U}_session{N}_{YYYY-MM-DD}.txt
       confidence      — true shows the "How sure are you?" tags on every problem.
                         Turn it on for checkpoints and any session where the gap
                         between confidence and correctness is what you want to see.
       stuckChips      — optional. Omit it to use the engine's default playbook moves;
                         pass an array to match the moves this session is drilling. */
    var CONFIG = {
      unit: 1,
      session: 1,
      title: 'Session title goes here',
      confidence: false
    };

    /* -------------------------------------------------------------- PROBLEMS
       Ramp them: the first problem should be a warm-up he clears without thinking,
       the last should be at or slightly past the top of his demonstrated range.
       A quiz he aces clean produced no information.

       question  the prompt, plain text, no markup
       math      optional monospace block — an expression, a table, an ASCII diagram
       answers   every form you will accept. Numeric and fraction forms are already
                 interchangeable (3/4 matches 0.75 and 6/8), so list alternates only
                 when the answer has genuinely different valid spellings.
       hints     up to three, ordered: a nudge, then stronger, then the strongest you
                 are willing to give. The third hint should still stop short of the
                 answer.
       strand    which thread of the curriculum this exercises
       level     'core' | 'stretch' | 'reach' */
    var PROBLEMS = [
      {
        question: 'A worked example. Replace this whole array.',
        math: '3/4 + 1/6 = ?',
        answers: ['11/12'],
        hints: [
          'What do both denominators divide into?',
          'Twelfths. Rewrite each fraction in twelfths before you add.',
          '3/4 is 9/12. Now do the same to 1/6 and add the numerators.'
        ],
        strand: 'fractions',
        level: 'core'
      },
      {
        question: 'A second example, harder than the first.',
        answers: ['-2', '−2'],
        hints: [
          'Try it with smaller numbers first and see what happens.',
          'The sign of the result depends on only one of the two factors here.',
          'Work out the magnitude and the sign separately, then put them together.'
        ],
        strand: 'integers',
        level: 'stretch'
      }
    ];

    MathQuiz.start(CONFIG, PROBLEMS);
  </script>
</body>
</html>
