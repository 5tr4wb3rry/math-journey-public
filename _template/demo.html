<!doctype html>
<!--
  ENGINE SMOKE TEST — not a session, not linked from index.html, never given to the kid.
  Three problems chosen to exercise every path: one with a full three-rung hint ladder,
  one meant to be skipped (leave it blank and use "I'm stuck"), one plain with no hints.
  Confidence tags are on so that path is covered too.

  Unlike _template/quiz.html this file sits one level below public/, so its asset paths
  (../assets/) are correct as written and it runs where it stands. Open it in a browser
  after any change to quiz.js or quiz.css.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engine smoke test — Math Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/quiz.css">
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">Engine smoke test</p>
      <h1>Three problems, every path</h1>
      <p class="lede">
        Hints on problem 1, a skip path on problem 2, nothing but an answer box on
        problem 3. If all of this behaves, the engine is good.
      </p>
    </header>
    <main id="quiz"></main>
  </div>

  <script src="../assets/quiz.js"></script>
  <script>
    var CONFIG = {
      unit: 0, session: 'demo', title: 'Engine smoke test', confidence: true,
      topics: ['Units-digit and last-digit cycles', 'Rate, work, and mixture problems']
    };

    var PROBLEMS = [
      {
        question: 'If x + 1/x = 4, what is x² + 1/x²?',
        math: 'x + 1/x = 4',
        answers: ['14'],
        hints: [
          'What happens if you square both sides?',
          'Squaring the left gives you three terms, not two. Write all three out.',
          'The middle term is 2·x·(1/x). Work out what that equals, then subtract it.'
        ],
        strand: 'identities',
        level: 'core'
      },
      {
        question: 'Two pipes fill a pool in 6 hours and 3 hours. Working together, how many hours does it take? (Leave this blank and try the "I\'m stuck" button.)',
        answers: ['2'],
        hints: [
          'How much of the pool does each pipe fill in one hour?',
          'Add the two hourly rates together to get the combined rate.',
          'You now have a rate in pools-per-hour. The question asks for hours — that is not the same number.'
        ],
        strand: 'rates',
        level: 'stretch'
      },
      {
        question: 'What is 3/4 + 1/6? (Answer as a fraction or a decimal — both are accepted.)',
        answers: ['11/12'],
        hints: [],
        strand: 'fractions',
        level: 'core'
      }
    ];

    MathQuiz.start(CONFIG, PROBLEMS);
  </script>
</body>
</html>
